<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日治愈空间 · Daily Healing Space</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #6a5acd;
            --accent: #ff9a9e;
            --text: #2d3436;
            --light: #f5f6fa;
        }
        body {
            margin:0; font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--light); color: var(--text);
            min-height: 100vh; overflow-x: hidden;
        }
        .bg {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.4)),
                        url('https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN') center/cover;
            z-index: -2;
        }
        .overlay {
            position: fixed; inset: 0;
            background: linear-gradient(to bottom, rgba(106,90,205,0.18), rgba(255,154,158,0.12));
            z-index: -1;
        }
        .container {
            max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem;
            position: relative; z-index: 1;
        }
        header { text-align: center; padding: 5rem 0 2rem; color: white; text-shadow: 0 3px 12px rgba(0,0,0,0.5); }
        h1 { font-size: 4.2rem; margin-bottom: 0.6rem; letter-spacing: 3px; }
        .subtitle { font-size: 1.5rem; opacity: 0.92; }
        .quote-card {
            background: rgba(255,255,255,0.94); border-radius: 28px;
            padding: 3.5rem 3rem; margin: 2.5rem auto; max-width: 950px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.18); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.4); text-align: center;
            animation: float 7s ease-in-out infinite;
        }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .quote-en { font-size: 2.3rem; font-style: italic; line-height: 1.45; color: #444; margin-bottom: 1.4rem; }
        .quote-zh { font-size: 2.1rem; line-height: 1.55; color: var(--primary); font-weight: 500; }
        .author { font-size: 1.4rem; color: #555; margin-top: 1.8rem; font-style: italic; }
        .modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 2rem; margin: 3.5rem 0; }
        .card {
            background: rgba(255,255,255,0.9); border-radius: 22px; padding: 2rem;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12); transition: all 0.4s ease; backdrop-filter: blur(10px);
        }
        .card:hover { transform: translateY(-12px); box-shadow: 0 25px 60px rgba(0,0,0,0.2); }
        .card h3 { margin-bottom: 1.2rem; font-size: 1.6rem; display: flex; align-items: center; gap: 1rem; }
        .card:nth-child(1) h3 { color: #4a90e2; }
        .card:nth-child(2) h3 { color: #e74c3c; }
        .card:nth-child(3) h3 { color: #27ae60; }
        .card:nth-child(4) h3 { color: #f39c12; }
        .tips-list { list-style: none; }
        .tips-list li { margin: 1rem 0; padding-left: 2rem; position: relative; }
        .tips-list li::before { content: "🌿"; position: absolute; left: 0; color: var(--accent); }
        .poem { font-family: 'KaiTi', serif; font-size: 1.5rem; line-height: 2.1; text-align: center; color: #444; padding: 1.8rem 0; border-top: 1px dashed #ddd; border-bottom: 1px dashed #ddd; }
        footer { text-align: center; padding: 4rem 0 2rem; color: white; opacity: 0.85; font-size: 1rem; }
        audio { position: fixed; bottom: 1rem; right: 1rem; width: 0; height: 0; opacity: 0; }
    </style>
</head>
<body>

    <div class="bg" id="bg"></div>
    <div class="overlay"></div>

    <div class="container">
        <header>
            <h1>每日治愈空间</h1>
            <p class="subtitle">温柔迎接每一天 · Embrace Each Day with Grace</p>
        </header>

        <div class="quote-card">
            <p class="quote-en" id="en">Loading...</p>
            <p class="quote-zh" id="zh">加载中...</p>
            <p class="author" id="author"></p>
        </div>

        <div class="modules">
            <div class="card">
                <h3><i class="fas fa-leaf"></i> 今日小确幸</h3>
                <ul class="tips-list" id="tips"></ul>
            </div>
            <div class="card">
                <h3><i class="fas fa-heart"></i> 温柔提醒</h3>
                <p class="poem" id="reminder"></p>
            </div>
            <div class="card">
                <h3><i class="fas fa-star"></i> 诗意一刻</h3>
                <p class="poem" id="poem"></p>
            </div>
            <div class="card">
                <h3><i class="fas fa-sun"></i> 今日小愿望</h3>
                <p class="poem" id="wish"></p>
            </div>
        </div>

        <footer>
            <p>每一次刷新，都是与美好重逢 · Powered by open source & ❤️</p>
        </footer>
    </div>

    <!-- 纯雨声（免费循环雨声示例，来自 Pixabay / 公共域） -->
    <audio id="bgm" loop volume="0.4" preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_9f8d7c5e4a.mp3?filename=gentle-rain-ambient-112190.mp3" type="audio/mpeg">
        <!-- 如果上面失效，可替换为这个备选（另一个常见雨声循环）：
        https://cdn.pixabay.com/download/audio/2022/05/25/audio_6b8f2d1e.mp3?filename=rain-on-window-123457.mp3 -->
    </audio>

    <script>
        // 金句
        async function fetchQuote() {
            try {
                const res = await fetch('https://api.quotable.io/random?tags=inspirational');
                const data = await res.json();
                document.getElementById('en').textContent = data.content;
                document.getElementById('zh').textContent = data.content + "（中文意译待完善）";
                document.getElementById('author').textContent = "— " + (data.author || "Anonymous");
            } catch (e) {
                document.getElementById('en').textContent = "You are enough just as you are.";
                document.getElementById('zh').textContent = "你现在的样子就已经足够好了。";
                document.getElementById('author').textContent = "— Unknown";
            }
        }

        // 随机内容数组
        const tipsPool = ["泡一杯喜欢的花茶，慢慢品味当下的宁静。","深呼吸三次，感受空气温柔地拥抱你。","写下一件让你微笑的小事，留给未来的自己。","午后晒晒太阳，让温暖渗进心里。","听一首老歌，回忆那些美好的瞬间。","给远方的朋友发一条问候，传递温暖。","整理一下桌面，心也跟着清爽起来。","赤脚踩在草地上，感受大地的脉动。","点一支香薰，营造属于自己的小世界。","抬头看云，想象它们的故事。","喝一口凉白开，简单却治愈。","伸个懒腰，对身体说声谢谢。","看一本童年喜欢的书，重温纯真。"];
        const remindersPool = ["你已经做得够好了，今天可以再多爱自己一点。","累了就停下来，世界不会因为你慢一点而崩塌。","你值得所有温柔，包括你给自己的。","每一次呼吸，都是新的开始。","今天的你，比昨天更勇敢一点了哦。","允许自己偶尔脆弱，也允许自己慢慢愈合。","你不必完美，只要真实就好。","小步前进，也是一种了不起的坚持。","相信时间会把最好的留给你。","对自己说：没关系，一切都会过去的。"];
        const poemsPool = ["愿你出走半生，归来仍是少年。","山有木兮木有枝，心悦君兮君不知。","桃之夭夭，灼灼其华。","愿你被世界温柔以待，也愿你成为自己的光。","星星在哪里，答案就在哪里。","春风十里不如你，明月清辉也为你。","愿岁月待你温柔以待。","人生如梦，一樽还酹江月。"];
        const wishesPool = ["愿明天醒来时，阳光正好，心情正好。","希望今天的小愿望，都能慢慢实现。","愿你遇见的所有人，都温柔且善良。","愿生活总有惊喜，等着你去发现。","希望你能一直做那个勇敢追梦的自己。","愿每一天都像清晨的第一缕光，温暖明亮。","愿世界对你温柔，你也对自己温柔。","愿平安喜乐，常伴左右。"];

        function updateExtras() {
            const tipsEl = document.getElementById('tips');
            tipsEl.innerHTML = '';
            const shuffledTips = tipsPool.sort(() => 0.5 - Math.random()).slice(0,4);
            shuffledTips.forEach(t => {
                const li = document.createElement('li');
                li.textContent = t;
                tipsEl.appendChild(li);
            });

            document.getElementById('reminder').textContent = remindersPool[Math.floor(Math.random()*remindersPool.length)];
            document.getElementById('poem').textContent = poemsPool[Math.floor(Math.random()*poemsPool.length)];
            document.getElementById('wish').textContent = wishesPool[Math.floor(Math.random()*wishesPool.length)];
        }

        // 必应壁纸
        async function loadBing() {
            try {
                const proxy = 'https://api.allorigins.win/raw?url=';
                const res = await fetch(proxy + encodeURIComponent('https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1'));
                const data = await res.json();
                if (data.images?.[0]) {
                    let url = 'https://www.bing.com' + data.images[0].url;
                    url = url.replace(/_\d+x\d+\./, '_UHD.');
                    document.getElementById('bg').style.backgroundImage = `linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.4)),url(${url})`;
                }
            } catch {}
        }

        // 雨声播放
        const audio = document.getElementById('bgm');
        function tryPlay() {
            audio.play().catch(e => console.log("播放需交互：", e.message));
        }
        ['click','touchstart','keydown'].forEach(ev => document.addEventListener(ev, tryPlay, {once:true}));
        window.addEventListener('load', () => setTimeout(tryPlay, 2000));

        // 启动
        loadBing();
        fetchQuote();
        updateExtras();
    </script>
</body>
</html>
